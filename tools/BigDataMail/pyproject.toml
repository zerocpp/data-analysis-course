[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mailgain"
version = "0.1.0"
description = "Teacher-side CLI for collecting CodeSetArena Stage 1 submissions from email."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
mailgain = "mailgain.cli:main"
code-set-arena = "mailgain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]


